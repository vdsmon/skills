#:schema https://mise.jdx.dev/schema/mise.json

# Maintainer task runner. Pure-content repo: no toolchain to pin, just thin
# wrappers over scripts/. Consumers install plugins via the marketplaces; none
# of this ships into a plugin. Scripts stay runnable standalone (bash scripts/*).
# The one build is vendor:dazzle, whose output is committed.

[tasks.sync]
description = "Regenerate derived files: Codex symlinks + marketplace, marketplace descriptions/versions, Codex openai.yaml, README table"
run = "scripts/sync-codex.sh"

[tasks.bump]
description = "Bump a plugin version + marketplace entry (level: patch|minor|major)"
run = "scripts/bump-plugin.sh {{arg(name='plugin')}} {{arg(name='level', default='patch')}}"

[tasks.test]
description = "Run every offline test suite (plugins/*/tests/test-*.sh), never the live token-spending ones"
run = "scripts/test-offline.sh"

[tasks."test:quiet-watch"]
description = "Run the cc-quiet-watch mod tests (needs the claude CLI, so CI does not run them)"
run = "claude plugin validate plugins/cc-quiet-watch && claude plugin test plugins/cc-quiet-watch"

[tasks."test:pitstop"]
description = "Run the cc-pitstop mod tests (needs the claude CLI, so CI does not run them)"
run = "claude plugin validate plugins/cc-pitstop && claude plugin test plugins/cc-pitstop"

[tasks."test:keepwarm"]
description = "Run the cc-keepwarm mod tests (needs the claude CLI, so CI does not run them)"
run = "claude plugin validate plugins/cc-keepwarm && claude plugin test plugins/cc-keepwarm"

[tasks."test:autotitle"]
description = "Run the cc-autotitle mod tests (needs the claude CLI, so CI does not run them)"
run = "claude plugin validate plugins/cc-autotitle && claude plugin test plugins/cc-autotitle"

[tasks."test:wrap-up"]
description = "Run the cc-wrap-up mod tests (needs the claude CLI, so CI does not run them)"
run = "claude plugin validate plugins/cc-wrap-up && claude plugin test plugins/cc-wrap-up"

[tasks."test:dazzle"]
description = "Run the cc-dazzle mod tests (needs the claude CLI, so CI does not run them)"
run = "claude plugin validate plugins/cc-dazzle && claude plugin test plugins/cc-dazzle"

[tasks."vendor:dazzle"]
description = "Rebuild cc-dazzle's hooks/vendor bundles from scripts/dazzle-vendor (needs npm; the bundles are committed)"
dir = "scripts/dazzle-vendor"
run = "npm ci && node build.mjs"

[tasks."test:handoff"]
description = "Run the handoff script checks (handoff.sh and baseline.sh, offline)"
run = "bash plugins/handoff/tests/test-handoff.sh"

[tasks."test:open-pr"]
description = "Run the open-pr body checker tests (offline)"
run = "bash plugins/open-pr/tests/test-open-pr.sh"

[tasks.verify]
description = "Fail if derived files are stale (sync not run after a plugin change) or scripts/check.py finds a broken invariant"
run = """
set -- .agents .claude-plugin/marketplace.json README.md 'plugins/*/.codex-plugin' 'plugins/*/skills/*/agents/openai.yaml'
scripts/sync-codex.sh >/dev/null
[ -z "$(git status --porcelain -- "$@")" ] || {
  echo 'Derived files were stale and sync just rewrote them: review and commit.' >&2
  git --no-pager status --short -- "$@"
  exit 1
}
python3 scripts/check.py
"""
