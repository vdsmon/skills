name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS because the hooks and their tests use BSD stat and date.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derived files are up to date
        run: |
          bash scripts/sync-codex.sh
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Derived files are stale. Run scripts/sync-codex.sh (mise run sync) and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi

      - name: Repo invariants
        if: ${{ !cancelled() }}
        run: python3 scripts/check.py

      # Offline suites only. tests/live-*.sh spend tokens and never run in CI.
      - name: Offline test suites
        if: ${{ !cancelled() }}
        run: bash scripts/test-offline.sh
